<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Account Recovery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Shared and Page-Specific Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ==================== HEADER ==================== -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold tracking-tight text-indigo-400">DevPortfolio</a>
            <a href="admin.html" class="text-xs text-slate-400 hover:text-indigo-400 transition-colors">Back to Login</a>
        </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="flex-grow flex items-center justify-center px-6 py-12 w-full">
        
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            
            <div class="text-center mb-8">
                <span class="inline-block py-1 px-3 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-semibold mb-3 tracking-wide uppercase border border-indigo-500/20">
                    Security Recovery
                </span>
                <h1 class="text-2xl font-bold text-white mb-2">Request Temp Password</h1>
                <p class="text-slate-400 text-sm">Enter your registered admin email address to receive a secure temporary password.</p>
            </div>

            <!-- Feedback Message Container -->
            <div id="recovery-feedback" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

            <form id="recovery-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Admin Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="you@example.com"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors text-sm"
                    >
                </div>

                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-6 rounded-lg shadow-lg transition-all text-sm flex items-center justify-center space-x-2"
                >
                    <span>Send Temporary Password</span>
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500">
                Remember your password? <a href="admin.html" class="text-indigo-400 hover:underline">Log in here</a>
            </div>
        </div>

    </main>

    <!-- Page-Specific JavaScript -->
    <script src="js/forgot-password.js"></script>
</body>
</html>
