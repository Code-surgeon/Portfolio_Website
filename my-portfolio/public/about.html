<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | About & Skills</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Shared and Page-Specific Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/about.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ==================== HEADER / NAVBAR ==================== -->
     <header>
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" style="font-size:30px;" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <span  class="w-3 h-3 rounded-full bg-indigo-500 inline-block"></span>
                My Portfolio
            </a>
        </div>
    </header>

   


    <!-- ==================== MAIN CONTENT ==================== -->
   <!-- ==================== MAIN CONTENT ==================== -->
    <main class="flex-grow flex flex-col items-center max-w-6xl mx-auto px-6 py-12 w-full space-y-12">
            
        <!-- Back Navigation Button -->
        <div class="w-full max-w-6xl flex justify-start">
            <a href="index.html" class="inline-flex items-center space-x-2 text-sm font-medium text-slate-400 hover:text-indigo-400 bg-slate-900 border border-slate-800 hover:border-indigo-500/30 px-4 py-2 rounded-lg transition-all shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>Back to Home</span>
            </a>
        </div>

        <!-- Bio / Background Section -->
        <section class="w-full flex flex-col items-center text-center">
            <span class="inline-block py-1 px-3 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-semibold mb-3 tracking-wide uppercase border border-indigo-500/20">
                Background
            </span>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white mb-6">
                About Me
            </h1>
            <div id="about-bio-container" class="text-slate-300 text-base md:text-lg leading-relaxed max-w-3xl space-y-4 mx-auto text-center">
                <p class="animate-pulse bg-slate-900 h-6 rounded w-full"></p>
                <p class="animate-pulse bg-slate-900 h-6 rounded w-5/6 mx-auto"></p>
            </div>
        </section>

        <!-- ==================== MINI NAVBAR (TABS) ==================== -->
        <div class="w-full flex justify-center border-b border-slate-800 pb-6">
            <div class="inline-flex flex-wrap justify-center gap-2 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800">
                <button onclick="switchTab('skills')" id="tab-skills" class="tab-btn px-5 py-2.5 rounded-lg text-sm font-medium transition-all text-white bg-indigo-600 shadow-sm">
                    Technical Skills
                </button>
                <button onclick="switchTab('experience')" id="tab-experience" class="tab-btn px-5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800/60">
                    Experience & Education
                </button>
                <button onclick="switchTab('activities')" id="tab-activities" class="tab-btn px-5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-white hover:bg-slate-800/60">
                    Activities & Certifications
                </button>
            </div>
        </div>

        <!-- ==================== TAB CONTENT PANELS ==================== -->

        <!-- 1. Technical Skills Panel -->
        <div id="panel-skills" class="tab-panel w-full max-w-6xl flex flex-col items-center">
            <div id="skills-container" class="flex flex-wrap justify-center gap-6 w-full">
                <!-- Fallback / Pulse Loader -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 animate-pulse w-full md:w-[calc(50%-12px)] lg:w-[calc(33.333%-16px)] max-w-md">
                    <div class="h-4 bg-slate-800 rounded w-1/2 mb-4 mx-auto"></div>
                    <div class="h-3 bg-slate-800 rounded w-full mb-2"></div>
                    <div class="h-3 bg-slate-800 rounded w-3/4 mx-auto"></div>
                </div>
            </div>
        </div>

        <!-- 2. Experience & Education Panel -->
        <div id="panel-experience" class="tab-panel w-full max-w-3xl hidden flex-col space-y-6">
            <div id="experience-container" class="space-y-6 w-full">
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 animate-pulse">
                    <div class="h-4 bg-slate-800 rounded w-1/3 mb-4"></div>
                    <div class="h-3 bg-slate-800 rounded w-full mb-2"></div>
                </div>
            </div>
        </div>

        <!-- 3. Professional Activities Panel -->
        <div id="panel-activities" class="tab-panel w-full max-w-4xl hidden flex-col">
            <div id="activities-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 animate-pulse">
                    <div class="h-4 bg-slate-800 rounded w-2/3 mb-4"></div>
                    <div class="h-3 bg-slate-800 rounded w-full"></div>
                </div>
            </div>
        </div>

    </main>
   

    <!-- Page-Specific JavaScript -->
    <script src="js/about.js"></script>
</body>
</html>
