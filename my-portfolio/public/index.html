<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Home</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Shared and Page-Specific Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ==================== HEADER / NAVBAR ==================== -->
    <header>
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" style="font-size:30px;" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <span  class="w-3 h-3 rounded-full bg-indigo-500 inline-block"></span>
                My Portfolio
            </a>
        </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="flex-grow flex flex-col items-center justify-center">
        
        <!-- Hero Section -->
        <section class="max-w-4xl w-full mx-auto px-6 py-12 md:py-20 flex flex-col items-center text-center justify-center">
            
            <span class="inline-block py-1 px-3 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-semibold mb-6 tracking-wide uppercase border border-indigo-500/20">
                Full-Stack Developer & Student
            </span>
            
            <!-- Circular Profile Picture & Name Container -->
            <div id="hero-profile-container" class="flex flex-col items-center justify-center mb-6 hidden">
                <div class="relative w-56 h-56 sm:w-64 sm:h-64 rounded-full overflow-hidden border-2 border-indigo-500/30 shadow-xl shadow-indigo-500/10 mb-4 bg-slate-900">
                    <img id="hero-my-picture" src="" alt="Profile Picture" class="w-full h-full object-cover">
                </div>
                <h2 id="hero-my-name" class="text-2xl sm:text-3xl font-bold text-white tracking-tight"></h2>
            </div>


            <h1 id="hero-title" class="text-4xl sm:text-5xl md:text-6xl font-black tracking-tight mb-6 leading-[1.1] max-w-3xl bg-gradient-to-r from-violet-400 via-fuchsia-400 to-cyan-400 bg-clip-text text-transparent filter drop-shadow-[0_5px_15px_rgba(168,85,247,0.25)]">
                I build cool things.
            </h1>
            


            <!-- CTA Buttons -->
            <div class="flex flex-wrap items-center justify-center gap-4 mb-4">
                <a href="projects.html" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl shadow-lg shadow-indigo-600/20 transition-all transform hover:-translate-y-0.5">
                    Explore Projects
                </a>

                <a href="about.html" class="bg-slate-900 hover:bg-slate-800 text-slate-200 font-medium px-6 py-3 rounded-xl border border-slate-800 hover:border-slate-700 transition-all">
                    About & Skills
                </a>

                <a href="contact.html" class="bg-transparent hover:bg-slate-900/60 text-slate-300 font-medium px-6 py-3 rounded-xl border border-slate-800 hover:border-slate-700 transition-all">
                    Get in Touch
                </a>
            </div>

            <!-- Horizontally Locked Social Links Container (Farther Down & Centered) -->
            <div id="social-links" style="font-size:20px;" class="font-bold flex flex-row flex-nowrap items-center justify-center space-x-6 overflow-x-auto py-3 px-2 mt-16 max-w-full text-sm">
                <!-- Social links populated dynamically from JS -->
            </div>
        
        </section>

    </main>

    <!-- Page-Specific JavaScript -->
    <script src="js/index.js"></script>
</body>
</html>
