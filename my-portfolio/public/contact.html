<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Contact</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Shared and Page-Specific Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ==================== HEADER / NAVBAR ==================== -->
     <header>
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" style="font-size:30px;" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <span  class="w-3 h-3 rounded-full bg-indigo-500 inline-block"></span>
                My Portfolio
            </a>
        </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
   <main class="flex-grow flex flex-col items-center justify-center max-w-4xl mx-auto px-6 py-12 md:py-20 w-full">
        
        <!-- Back Navigation Button -->
        <div class="w-full max-w-6xl flex justify-start mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2 text-sm font-medium text-slate-400 hover:text-indigo-400 bg-slate-900 border border-slate-800 hover:border-indigo-500/30 px-4 py-2 rounded-lg transition-all shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>Back to Home</span>
            </a>
        </div>

        <!-- Page Header -->
        <div class="mb-10 text-center flex flex-col items-center justify-center">
            <span class="inline-block py-1 px-3 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-semibold mb-3 tracking-wide uppercase border border-indigo-500/20">
                Inquiries
            </span>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white mb-3">
                Get in Touch
            </h1>
            <p class="text-slate-400 text-base md:text-lg max-w-xl mb-4">
                Have a project in mind, a recruiting question, or want to discuss a software role? Drop me a message below.
            </p>
            <!-- Email Me At Label & Placeholder -->
            <div class="text-sm font-medium text-slate-300">
                Email me at: <a href="mailto:mihlayokuphela@gmail.com" class="text-indigo-400 hover:text-indigo-300 underline underline-offset-4">mihlayokuphela@gmail.com</a>
            </div>
        </div>

        <!-- Contact Card & Form Wrapper -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 md:p-10 shadow-xl w-full">
            
            <!-- Feedback Message Container -->
            <div id="form-feedback" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

            <form id="contact-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Name Field -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-300 mb-2">Your Name</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            required 
                            placeholder="Jane Doe"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors text-sm"
                        >
                    </div>
                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            placeholder="jane@company.com"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors text-sm"
                        >
                    </div>
                </div>

                <!-- Subject Field -->
                <div>
                    <label for="subject" class="block text-sm font-medium text-slate-300 mb-2">Subject</label>
                    <input 
                        type="text" 
                        id="subject" 
                        name="subject" 
                        placeholder="Software Engineering Role / Collaboration"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors text-sm"
                    >
                </div>

                <!-- Message Field -->
                <div>
                    <label for="message" class="block text-sm font-medium text-slate-300 mb-2">Message</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        rows="5" 
                        required 
                        placeholder="Type your message here..."
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors text-sm resize-none"
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-6 rounded-lg shadow-lg transition-all flex items-center justify-center space-x-2"
                >
                    <span>Send Message</span>
                </button>
            </form>
        </div>

</main>


    <!-- Page-Specific JavaScript -->
    <script src="js/contact.js"></script>
</body>
</html>
